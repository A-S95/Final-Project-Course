server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Não há endpoint /health no build estático — usa-se este só para o
    # HEALTHCHECK do container, sem tocar na SPA nem no backend.
    location = /health {
        default_type text/plain;
        return 200 "ok";
    }

    # SPA com routing no cliente (react-router-dom, BrowserRouter): qualquer
    # rota desconhecida do nginx (ex: /transacoes) tem de servir sempre o
    # mesmo index.html — é o próprio React que decide o que mostrar a partir
    # do URL, o nginx só serve ficheiros estáticos.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ficheiros com hash no nome (Vite gera um por build) podem ser cacheados
    # de forma agressiva — um deploy novo gera nomes novos, nunca reutiliza.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
