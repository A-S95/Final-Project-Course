name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync
      - name: Lint (ruff)
        run: uv run ruff check .

  lint-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (oxlint)
        run: npm run lint

  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fintrack
          POSTGRES_PASSWORD: fintrack
          POSTGRES_DB: fintrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fintrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Postgres real (não SQLite) — decisão da secção 8 do ARCHITECTURE.md.
      DATABASE_URL: postgresql+psycopg://fintrack:fintrack@localhost:5432/fintrack
      SECRET_KEY: ci-only-secret-key-with-more-than-thirty-two-chars
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Test (pytest)
        run: uv run pytest -q

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build (tsc + vite)
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fintrack
          POSTGRES_PASSWORD: fintrack
          POSTGRES_DB: fintrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fintrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fintrack:fintrack@localhost:5432/fintrack
      SECRET_KEY: ci-only-secret-key-with-more-than-thirty-two-chars
      CORS_ORIGINS: '["http://localhost:5173"]'
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync
      - name: Apply migrations
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Start backend
        working-directory: backend
        # stdout/stderr para um ficheiro: sem isto, se o arranque nunca ficar
        # pronto (ex: liga à base de dados mas fica preso algures), o único
        # sintoma visível é o "Wait for backend and frontend" a ficar pendurado
        # sem pista nenhuma de porquê.
        run: nohup uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start frontend
        working-directory: frontend
        run: nohup npm run dev -- --host > frontend.log 2>&1 &
      - name: Wait for backend and frontend
        # Timeout explícito (60s): sem isto, um `wait-on` que nunca é
        # satisfeito fica pendurado até ao limite do job (6h por omissão) em
        # vez de falhar depressa com um erro percetível.
        # `http-get://` (não `http://`): por omissão o `wait-on` faz HEAD, e
        # `/health` só está definido como `@app.get(...)` — HEAD devolvia
        # sempre 405, fazendo o `wait-on` esgotar o tempo mesmo com o backend
        # já de pé e a responder (apanhado numa corrida real do CI).
        run: npx wait-on --timeout 60000 http-get://localhost:8000/health http-get://localhost:5173
      - name: Run E2E tests (Playwright)
        working-directory: frontend
        run: npm run test:e2e
      - name: Dump backend/frontend logs
        if: failure()
        run: |
          echo "--- backend.log ---"; cat backend/backend.log || true
          echo "--- frontend.log ---"; cat frontend/frontend.log || true
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t fintrack-backend ./backend
      - name: Build frontend image
        run: docker build -t fintrack-frontend ./frontend
